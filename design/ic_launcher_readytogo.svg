<?xml version="1.0" encoding="UTF-8"?>
<!--
  ReadyToGo 앱 아이콘 원본 (108x108 = Android adaptive icon 전체 영역)
  - 배경(background 레이어): 노을 그라데이션 사각형
  - 전경(foreground 레이어): 비행기 + 점선 궤적 + 핀
  - 안전 영역(가운데 66x66) 안에 핵심 요소가 들어가도록 배치됨
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- ===== background 레이어 ===== -->
  <g id="background">
    <rect width="108" height="108" fill="url(#sunset)"/>
    <circle cx="54" cy="56" r="34" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- ===== foreground 레이어 ===== -->
  <g id="foreground">
    <!-- 점선 궤적 -->
    <path d="M22 76 C 34 50, 52 60, 60 42 S 78 28, 86 32"
          fill="none" stroke="#ffffff" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="1 9"/>
    <!-- 비행기 (출발점) -->
    <g transform="translate(24 76) rotate(-40)">
      <path d="M0 -10 l3 7 l9 6 l-1 3 l-8 -3 l-1 6 l3 2 l-1 2 l-4 -1 l-4 1 l-1 -2 l3 -2 l-1 -6 l-8 3 l-1 -3 l9 -6 z" fill="#ffffff"/>
    </g>
    <!-- 핀 (도착점) -->
    <path d="M84 18 a11 11 0 0 1 11 11 c0 8 -11 20 -11 20 s-11 -12 -11 -20 a11 11 0 0 1 11 -11 z" fill="#ffffff"/>
    <circle cx="84" cy="29" r="4" fill="#F43F5E"/>
  </g>
</svg>
