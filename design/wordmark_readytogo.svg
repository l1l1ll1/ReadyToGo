<?xml version="1.0" encoding="UTF-8"?>
<!--
  ReadyToGo 워드마크 (C4 — 노을 배경용)
  - 글꼴: Sora (Google Fonts, OFL). "Ready" 600 / "ToGo" 800, letter-spacing -0.8
  - 색: Ready #FFFFFF, ToGo #FEF3C7(연노랑), 궤적·비행기 #FFFFFF, 핀 #FEF3C7, 핀 중심 #F43F5E
  - 옅은 그림자: dy 1.5, blur 1.5, #7C2D12 25%
  - 좌표계 300x80. 비행기(10,70)에서 출발 → 점선 궤적 → 마지막 'o' 위(272,2) 핀
  - 이 파일은 참고용 스펙. 앱에서는 Compose Text(Sora) + Canvas로 그리는 게 글꼴 렌더링이 정확함.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
    <path id="plane" d="M0 -10 l3 7 l9 6 l-1 3 l-8 -3 l-1 6 l3 2 l-1 2 l-4 -1 l-4 1 l-1 -2 l3 -2 l-1 -6 l-8 3 l-1 -3 l9 -6 z"/>
    <path id="pin" d="M0 0 a7 7 0 0 1 7 7 c0 5 -7 13 -7 13 s-7 -8 -7 -13 a7 7 0 0 1 7 -7 z"/>
  </defs>
  <g filter="url(#soft)">
    <text x="2" y="56" font-family="Sora, sans-serif" font-size="38" letter-spacing="-0.8">
      <tspan font-weight="600" fill="#FFFFFF">Ready</tspan><tspan font-weight="800" fill="#FEF3C7">ToGo</tspan>
    </text>
    <path d="M12 70 C 60 30, 140 20, 262 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
    <use href="#plane" transform="translate(10 70) rotate(-50) scale(0.75)" fill="#FFFFFF"/>
    <use href="#pin" transform="translate(272 2) scale(0.875)" fill="#FEF3C7"/>
    <circle cx="272" cy="9" r="2.4" fill="#F43F5E"/>
  </g>
</svg>
