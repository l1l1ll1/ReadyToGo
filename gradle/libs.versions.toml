[versions]
agp = "9.1.1"
coreKtx = "1.19.0"
# 시스템 시작 화면을 앱이 준비될 때까지 붙잡아 두기 위해. SplashScreen.kt 주석 참고.
coreSplashscreen = "1.0.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
playServicesMaps = "20.0.0"
mapsCompose = "8.6.0"
places = "5.3.0"
# maps-compose 8.6.0이 Kotlin 2.4로 빌드돼 있어 2.2 컴파일러로는 읽지 못한다.
kotlin = "2.4.10"
# core-ktx 1.19.0 / activity 1.13.0 / lifecycle 2.11.0이 내부적으로 Compose 1.10 이상을 요구한다.
# BOM이 이보다 낮으면 컴파일 classpath만 옛 버전에 묶여 런타임에 NoSuchMethodError가 난다.
composeBom = "2026.09.00"

# Firebase. BOM이 auth·firestore 버전을 맞춰주므로 개별 버전을 적지 않는다.
firebaseBom = "34.4.0"
googleServices = "4.4.3"
# Google 로그인. 예전 GoogleSignInClient(play-services-auth)는 deprecated라 Credential Manager를 쓴다.
credentials = "1.6.0"
googleid = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
places = { group = "com.google.android.libraries.places", name = "places", version.ref = "places" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 아이콘. extended를 쓰는 이유: 여행 목적 칩에 필요한 Spa·Museum·Restaurant·Hiking이
# core에는 없다. 버전은 Compose BOM이 맞춰준다.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Firebase. 8단계 2번 — 로그인과 저장을 실제 서비스로 바꾼다.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# Google 로그인. Credential Manager가 계정 선택창을 띄우고, googleid가 그 응답을
# Google ID 토큰으로 해석한다. 토큰을 Firebase Auth에 넘겨 로그인을 마친다.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-identity-googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

